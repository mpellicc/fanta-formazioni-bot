name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency: deploy-${{ github.ref_name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        run: |
          REPO="ghcr.io/${{ github.repository }}"
          TAGS="$REPO:${{ github.sha }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            TAGS="$TAGS,$REPO:latest,$REPO:${VERSION#v}"
          else
            TAGS="$TAGS,$REPO:dev"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      # Builds amd64 only, loads it into the local daemon and runs it: the
      # multi-arch push below never executes the image, so a container that
      # cannot start (e.g. a builder/runtime Python mismatch) would otherwise
      # reach the VM and fail at `docker compose up` (ADR 0034).
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: smoke-test:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: docker run --rm --entrypoint python smoke-test:${{ github.sha }} -c 'import fantaformazionibot.app'

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Tag pushes (releases) deploy production; pushes to main deploy the dev bot.
    environment: ${{ github.ref_type == 'tag' && 'production' || 'development' }}
    env:
      APP_DIR: ${{ github.ref_type == 'tag' && 'fantaformazionibot' || 'fantaformazionibot-dev' }}
      IMAGE_TAG: ${{ github.ref_type == 'tag' && 'latest' || 'dev' }}
    steps:
      - uses: actions/checkout@v7
      - name: Copy compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: compose.yaml
          target: ${{ env.APP_DIR }}
      - name: Write env file and restart
        uses: appleboy/ssh-action@v1
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_CHAT_ID: ${{ vars.CHANNEL_CHAT_ID }}
          DEBUG_CHAT_ID: ${{ vars.DEBUG_CHAT_ID }}
          ALLOWED_CHAT_IDS: ${{ vars.ALLOWED_CHAT_IDS }}
          ALLOWED_USER_IDS: ${{ vars.ALLOWED_USER_IDS }}
          CALENDAR_PROVIDER: ${{ vars.CALENDAR_PROVIDER }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          MOCK_KICKOFF_OFFSET: ${{ vars.MOCK_KICKOFF_OFFSET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: BOT_TOKEN,CHANNEL_CHAT_ID,DEBUG_CHAT_ID,ALLOWED_CHAT_IDS,ALLOWED_USER_IDS,CALENDAR_PROVIDER,FOOTBALL_DATA_API_KEY,MOCK_KICKOFF_OFFSET,APP_DIR,IMAGE_TAG
          script: |
            set -e
            cd ~/"$APP_DIR"
            umask 177
            printf 'TOKEN=%s\nCHANNEL_CHAT_ID=%s\nDEBUG_CHAT_ID=%s\nALLOWED_CHAT_IDS=%s\nALLOWED_USER_IDS=%s\nCALENDAR_PROVIDER=%s\nFOOTBALL_DATA_API_KEY=%s\nMOCK_KICKOFF_OFFSET=%s\nIMAGE_TAG=%s\n' \
              "$BOT_TOKEN" "$CHANNEL_CHAT_ID" "$DEBUG_CHAT_ID" "$ALLOWED_CHAT_IDS" "$ALLOWED_USER_IDS" \
              "${CALENDAR_PROVIDER:-fixturedownload}" "$FOOTBALL_DATA_API_KEY" \
              "${MOCK_KICKOFF_OFFSET:-10m}" "$IMAGE_TAG" > .env
            docker compose pull
            docker compose up -d

  release:
    if: github.ref_type == 'tag'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists, skipping"
          else
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          fi
