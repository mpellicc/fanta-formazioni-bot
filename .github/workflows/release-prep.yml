name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Ensure the workflow runs on dev
        if: github.ref_name != 'dev'
        run: |
          echo "::error::Run this workflow on the dev branch (got ${{ github.ref_name }})"
          exit 1
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Bump version
        id: bump
        run: |
          uv version --bump "${{ inputs.bump }}"
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      - name: Commit and push to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "Release v${{ steps.bump.outputs.version }}"
          git push
      - name: Open release PR (dev -> main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head dev \
            --title "Release v${{ steps.bump.outputs.version }}" \
            --body "Release PR for v${{ steps.bump.outputs.version }}. Merging deploys to production, tags the image, and publishes the GitHub release." \
            || echo "Release PR already open; the bump commit is included automatically"
