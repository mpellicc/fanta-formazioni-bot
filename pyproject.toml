[project]
name = "fantaformazionibot"
version = "0.10.0"
description = "Telegram bot that reminds you to set your Fantacalcio lineup"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Matteo Pelliccione", email = "mat.pelliccione@gmail.com" }]
requires-python = ">=3.13"
keywords = ["telegram", "telegram-bot", "fantasy-football", "reminder", "notification"]
dependencies = [
    "python-telegram-bot[job-queue]~=22.8",
    "pydantic-settings~=2.10",
    "httpx~=0.28",
]

[project.urls]
Homepage = "https://github.com/mpellicc/fanta-formazioni-bot"
Repository = "https://github.com/mpellicc/fanta-formazioni-bot"

[dependency-groups]
dev = [
    "mypy~=1.16",
    "pytest~=8.4",
    "ruff~=0.12",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.7,<1"]
build-backend = "uv_build"
