services:
  bot:
    image: ghcr.io/mpellicc/fanta-formazioni-bot:${IMAGE_TAG:-latest}
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /data/fantaformazionibot.db
    volumes:
      - bot-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
